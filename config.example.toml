[app]
poll_interval_seconds = 15
retention_days = 30
database_path = "/var/lib/xui-intelligence/monitoring.sqlite3"
log_level = "INFO"

[host]
enabled = true

[xray]
enabled = false
binary = "/usr/local/x-ui/bin/xray"
api_address = "127.0.0.1"
api_port = 62789

[xui_database]
enabled = false
snapshot_path = "/var/lib/xui-intelligence-snapshot/xui-readonly.sqlite3"
snapshot_max_age_seconds = 180

[telegram]
enabled = false
# Only positive numeric Telegram user IDs are accepted. Never use a public group.
allowed_user_ids = []
# Bot token is read ONLY from XUI_INTELLIGENCE_TELEGRAM_BOT_TOKEN in the service environment.
# Optional override for IDs: XUI_INTELLIGENCE_TELEGRAM_ALLOWED_IDS=123456789,987654321
